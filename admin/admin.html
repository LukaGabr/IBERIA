<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — IBERIA Menu Editor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ===== LOGIN VIEW ===== -->
<section id="login-view" class="login-view">
  <div class="login-box">
    <h1>IBERIA Admin</h1>
    <p class="login-sub">Log in to edit the menu</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="btn-primary">Log In</button>
      <p id="login-error" class="error-msg"></p>
    </form>
  </div>
</section>

<!-- ===== ADMIN / EDITOR VIEW (hidden until logged in) ===== -->
<section id="admin-view" class="admin-view" style="display: none;">
  <header class="admin-header">
    <h1>IBERIA Menu Editor</h1>
    <button id="logout-btn" class="btn-secondary">Log Out</button>
  </header>

  <div id="status-msg" class="status-msg"></div>

  <div id="categories-container"></div>

  <button id="add-category-btn" class="btn-primary add-category-btn">+ Add New Category</button>

  <!-- ===== IMPORT MENU FROM JSON ===== -->
  <section class="import-section" aria-labelledby="import-heading">
    <h2 id="import-heading">Import menu from JSON</h2>
    <p class="import-warning">Importing <strong>replaces the whole menu</strong>: every current category is deleted and the file's categories are created. You'll download a backup of the current menu first.</p>
    <label for="import-file-input" class="import-file-label">Choose a .json file</label>
    <input type="file" id="import-file-input" accept=".json,application/json">
    <div id="import-problems" class="import-problems"></div>
    <div id="import-preview" class="import-preview"></div>
    <div class="import-actions">
      <button id="import-backup-btn" class="btn-secondary" disabled>Download backup</button>
      <span id="import-backup-name" class="import-backup-name"></span>
      <button id="import-confirm-btn" class="btn-danger" disabled>Replace menu</button>
      <button id="import-cancel-btn" class="btn-secondary" disabled>Cancel</button>
    </div>
    <div id="import-status" class="status-msg"></div>
  </section>
</section>

<script type="module" src="admin.js"></script>
</body>
</html>

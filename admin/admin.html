<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — IBERIA Menu Editor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ===== LOGIN VIEW ===== -->
<section id="login-view" class="login-view">
  <div class="login-box">
    <h1>IBERIA Admin</h1>
    <p class="login-sub">Log in to edit the menu</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="btn-primary">Log In</button>
      <p id="login-error" class="error-msg"></p>
    </form>
  </div>
</section>

<!-- ===== ADMIN / EDITOR VIEW (hidden until logged in) ===== -->
<section id="admin-view" class="admin-view" style="display: none;">
  <header class="admin-header">
    <h1>IBERIA Menu Editor</h1>
    <button id="logout-btn" class="btn-secondary">Log Out</button>
  </header>

  <div id="status-msg" class="status-msg"></div>

  <div id="categories-container"></div>

  <button id="add-category-btn" class="btn-primary add-category-btn">+ Add New Category</button>
</section>

<script type="module" src="admin.js"></script>
</body>
</html>
